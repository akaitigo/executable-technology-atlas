<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">Expression AST redrawn from actual parser output</title><desc id="desc">Multiply subtree grouped below addition, not source-order evaluation.</desc><rect width="720" height="430" rx="18" fill="#edf2ec"/><g font-family="sans-serif" fill="#22432e"><text x="28" y="42" font-size="25">2 + 3 * 4 : AST evaluation = 14</text><text x="28" y="69" font-size="15">実Python parser出力の再描画 / naive左から = 20</text><line x1="405.0" y1="243" x2="300" y2="294" stroke="#889b8c" stroke-width="2"/><line x1="405.0" y1="243" x2="510" y2="294" stroke="#889b8c" stroke-width="2"/><line x1="247.5" y1="148" x2="90" y2="199" stroke="#889b8c" stroke-width="2"/><line x1="247.5" y1="148" x2="405.0" y2="199" stroke="#889b8c" stroke-width="2"/><rect x="54" y="197" width="72" height="48" rx="9" fill="#fff" stroke="#3d604a"/><text x="90" y="228" text-anchor="middle" font-size="23">2</text><rect x="264" y="292" width="72" height="48" rx="9" fill="#fff" stroke="#3d604a"/><text x="300" y="323" text-anchor="middle" font-size="23">3</text><rect x="474" y="292" width="72" height="48" rx="9" fill="#fff" stroke="#3d604a"/><text x="510" y="323" text-anchor="middle" font-size="23">4</text><rect x="369.0" y="197" width="72" height="48" rx="9" fill="#fff" stroke="#3d604a"/><text x="405.0" y="228" text-anchor="middle" font-size="23">*</text><rect x="211.5" y="102" width="72" height="48" rx="9" fill="#fff" stroke="#3d604a"/><text x="247.5" y="133" text-anchor="middle" font-size="23">+</text><text x="28" y="400" font-size="14">*のsubtreeを評価してから+へ。captureではない。</text></g></svg>