<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy 90%で同じでも、FNとFPは違う</title><desc id="desc">閾値0.3でFN0FP2、0.5でFN1FP1、0.9でFN2FP0。すべて正解18件</desc>
  <rect width="1120" height="380" rx="24" fill="#f7f9f5"/><text x="42" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#16353d">Accuracy 90%を、3つの内訳に分ける</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#fff" stroke="#b6ccc3"><rect x="42" y="98" width="320" height="200" rx="16"/><rect x="400" y="98" width="320" height="200" rx="16"/><rect x="758" y="98" width="320" height="200" rx="16"/></g>
  <g font-size="19" font-weight="700" fill="#16353d"><text x="202" y="136">閾値 0.30</text><text x="560" y="136">閾値 0.50</text><text x="918" y="136">閾値 0.90</text></g>
  <g font-size="32" font-weight="700" fill="#a64062"><text x="202" y="197">FN 0</text><text x="560" y="197">FN 1</text><text x="918" y="197">FN 2</text></g>
  <g font-size="24" font-weight="700" fill="#9c631d"><text x="202" y="237">FP 2</text><text x="560" y="237">FP 1</text><text x="918" y="237">FP 0</text></g>
  <g font-size="16" fill="#52685f"><text x="202" y="275">陽性2件とも検出</text><text x="560" y="275">陽性1件を見逃す</text><text x="918" y="275">陽性2件とも見逃す</text></g></g>
  <text x="560" y="345" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#52685f">この合成fixtureの観測。現実の運用閾値やSafety合格条件は決めていない。</text>
</svg>
