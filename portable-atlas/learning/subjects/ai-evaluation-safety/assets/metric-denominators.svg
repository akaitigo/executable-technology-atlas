<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">同じTPでもmetricの分母が違う</title><desc id="desc">Accuracyは全件、Precisionは陽性予測、Recallは実陽性、FPRは実陰性が分母になる</desc>
  <rect width="1120" height="360" rx="24" fill="#f7f9f5"/>
  <text x="42" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#16353d">何件のうちの何件？ 分母を先に読む</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#b6ccc3"><rect x="42" y="100" width="240" height="180" rx="16"/><rect x="307" y="100" width="240" height="180" rx="16"/><rect x="572" y="100" width="240" height="180" rx="16"/><rect x="837" y="100" width="240" height="180" rx="16"/></g>
    <g font-size="19" font-weight="700" fill="#16353d"><text x="162" y="142">Accuracy</text><text x="427" y="142">Precision</text><text x="692" y="142">Recall</text><text x="957" y="142">FPR</text></g>
    <g font-size="26" font-weight="700" fill="#287c63"><text x="162" y="200">(TP + TN) / N</text><text x="427" y="200">TP / (TP + FP)</text><text x="692" y="200">TP / (TP + FN)</text><text x="957" y="200">FP / (FP + TN)</text></g>
    <g font-size="16" fill="#52685f"><text x="162" y="246">全sampleの正解</text><text x="427" y="246">陽性予測の正確さ</text><text x="692" y="246">実陽性を拾えた割合</text><text x="957" y="246">実陰性を誤警報にした割合</text></g>
  </g><text x="560" y="323" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#805824">分母が0 → 未定義。0%や100%へ置換しない。</text>
</svg>
