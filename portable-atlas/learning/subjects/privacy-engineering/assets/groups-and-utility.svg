<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">同じ12件を別の粒度で出す</title><desc id="desc">識別子除去は12 singleton、一般化は4件ずつ3群、集計は3 count row。一般化と集計は使える細部も失う。</desc>
<rect width="1120" height="400" rx="24" fill="#f5f6ef"/>
<g font-family="sans-serif" fill="#293c48"><text x="38" y="52" font-size="26" font-weight="700">群を大きくすると、残せる細部も変わる。</text>
<g fill="#fff" stroke="#c0cbc4"><rect x="38" y="91" width="327" height="219" rx="18"/><rect x="396" y="91" width="327" height="219" rx="18"/><rect x="754" y="91" width="327" height="219" rx="18"/></g>
<g font-size="22" font-weight="700"><text x="60" y="133">識別子除去だけ</text><text x="418" y="133">QIを一般化</text><text x="776" y="133">群countだけ</text></g>
<g font-size="21"><text x="60" y="185" fill="#9b4c45">12群 × 1件</text><text x="418" y="185" fill="#3b7169">3群 × 4件</text><text x="776" y="185" fill="#3b7169">count = 4, 4, 4</text></g>
<g font-size="17"><text x="60" y="236">age / zoneの細部は残る</text><text x="418" y="236">age帯 / zone先頭記号</text><text x="776" y="236">個別rowとcategoryは出さない</text>
<text x="60" y="274">nameを消しても群sizeは1</text><text x="418" y="274">categoryは残る</text><text x="776" y="274">3出力row ≠ 3人</text></g>
<text x="38" y="358" font-size="18">original説明図。指定QIの架空群だけ。k条件を満たしても全privacy/DPを保証しない。</text></g></svg>
