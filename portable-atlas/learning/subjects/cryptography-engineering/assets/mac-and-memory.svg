<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">MACと再送防止の記憶は別</title><desc id="desc">同じmessageとtagは2回ともMACを通る。別の認証済みID記憶がある場合だけ2回目を拒否する。記憶reset後は再び受け入れる。</desc>
<rect width="1120" height="420" rx="24" fill="#f6f5ef"/>
<g font-family="sans-serif" fill="#233e48"><text x="40" y="50" font-size="26" font-weight="700">正しいbytesの再送でも、MACは正しいまま。</text>
<g fill="#fff" stroke="#b8c8c6"><rect x="40" y="90" width="325" height="235" rx="18"/><rect x="398" y="90" width="325" height="235" rx="18"/><rect x="756" y="90" width="325" height="235" rx="18"/></g>
<g font-size="21" font-weight="700"><text x="64" y="130">初回</text><text x="422" y="130">同じbytesを再送</text><text x="780" y="130">guardをresetして再送</text></g>
<g font-size="19"><text x="64" y="179">MAC: 通る</text><text x="422" y="179">MAC: 通る</text><text x="780" y="179">MAC: 通る</text>
<text x="64" y="220" fill="#2d7667">別のguard: 受入</text><text x="422" y="220" fill="#a04942">別のguard: 既出IDで拒否</text><text x="780" y="220" fill="#2d7667">別のguard: 受入</text>
<text x="64" y="279">seen = { demo-001 }</text><text x="422" y="279">記憶を保持</text><text x="780" y="279">記憶が消える境界</text></g>
<text x="40" y="373" font-size="18">original説明図。単一processのID集合だけ。永続化・分散・TTL・実運用安全性は未実装。</text></g></svg>
