<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Role inheritance and exact scope graph</title><desc id="desc">Subject assignment, project scope, editor to viewer inheritance and read permission</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#317964"/></marker></defs>
  <rect width="1200" height="430" rx="28" fill="#f6f8f4"/><text x="58" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#18323a">Policy graph: RoleはScopeの外へ持ち出さない</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#18323a"><rect x="55" y="145" width="170" height="82" rx="16"/><rect x="275" y="145" width="210" height="82" rx="16"/><rect x="535" y="145" width="150" height="82" rx="16"/><rect x="735" y="145" width="150" height="82" rx="16"/><rect x="935" y="145" width="205" height="82" rx="16"/></g><g fill="#fff" font-size="18" font-weight="700"><text x="140" y="181">subject-01</text><text x="140" y="206" font-size="13">authenticated: assumed</text><text x="380" y="181">assignment</text><text x="380" y="206" font-size="13">scope: project-alpha</text><text x="610" y="193">editor</text><text x="810" y="193">viewer</text><text x="1037" y="181">document.read</text><text x="1037" y="206" font-size="13">document-001</text></g></g>
  <g stroke="#317964" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M225 186H275"/><path d="M485 186H535"/><path d="M685 186H735"/><path d="M885 186H935"/></g>
  <g font-family="sans-serif" font-size="14" fill="#4b625f" text-anchor="middle"><text x="250" y="173">assigned</text><text x="510" y="173">activates</text><text x="710" y="173">inherits</text><text x="910" y="173">grants</text></g>
  <rect x="275" y="285" width="210" height="74" rx="14" fill="#f7e6e3" stroke="#b85048"/><text x="380" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#8e312c">project-beta</text><text x="380" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8e312c">assignmentなし → deny</text><path d="M380 227V285" stroke="#b85048" stroke-width="4" stroke-dasharray="8 7"/>
</svg>
