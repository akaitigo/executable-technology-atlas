<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Permission grant revocation transition</title><desc id="desc">The same request changes from allow to deny after a read grant is removed</desc><rect width="1200" height="400" rx="28" fill="#f6f8f4"/><text x="58" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#18323a">同じRequestでも、Policy snapshotが変われば再評価する</text>
  <g font-family="sans-serif"><rect x="70" y="115" width="400" height="190" rx="22" fill="#e3f0ea" stroke="#76a895"/><text x="105" y="155" font-size="20" font-weight="700" fill="#1e654f">policy-v1</text><text x="105" y="195" font-size="17" fill="#244c41">viewer grants document.read</text><text x="105" y="228" font-size="17" fill="#244c41">editor inherits viewer</text><text x="105" y="274" font-size="29" font-weight="800" fill="#1e795a">ALLOW</text>
  <path d="M470 210H730" stroke="#a97521" stroke-width="5"/><path d="M710 194L735 210L710 226" fill="none" stroke="#a97521" stroke-width="5"/><text x="600" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#785717">remove permission grant</text>
  <rect x="730" y="115" width="400" height="190" rx="22" fill="#f7e6e3" stroke="#b85048"/><text x="765" y="155" font-size="20" font-weight="700" fill="#8e312c">policy-v2-read-grant-revoked</text><text x="765" y="195" font-size="17" fill="#713d39">viewer grants []</text><text x="765" y="228" font-size="17" fill="#713d39">no cached allow reused</text><text x="765" y="274" font-size="29" font-weight="800" fill="#b33f37">DENY</text></g>
  <text x="600" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#536970">この教材は分散伝播時間・Session cache・Policy distributionを実装しない</text>
</svg>
