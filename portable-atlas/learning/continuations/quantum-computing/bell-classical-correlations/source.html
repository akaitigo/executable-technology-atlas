<!doctype html><html lang="ja"><meta charset="utf-8"><title>実装を読む</title><style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:24px;background:#101a29;color:#eaf1fc}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#8fceff}</style><p><a href="index.html">教材へ戻る</a></p><h1 id="name"></h1><pre id="source"></pre><script>const name=new URLSearchParams(location.search).get('file');if(['quantum.py','verify.py','hand-oracle.json'].includes(name)){document.getElementById('name').textContent=name;fetch(name).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>document.getElementById('source').textContent=t).catch(e=>document.getElementById('source').textContent='取得失敗: '+e.message)}else{document.getElementById('source').textContent='未対応source'}</script></html>
