<!doctype html><html lang="ja"><meta charset="utf-8"><title>tick stateと描画の分離</title><style>body{font:16px system-ui;background:#101a2d;color:#e5eefb;max-width:1040px;margin:30px auto;padding:20px}button,input,textarea{font:inherit;padding:9px;margin:5px;border-radius:5px}button{cursor:pointer;background:#cee8ff}textarea{width:96%;height:65px}a{color:#85d4ff}table{border-collapse:collapse;width:100%}td,th{border:1px solid #536681;padding:6px}canvas{background:#fff;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}label{display:block}#casebuttons{display:flex;flex-wrap:wrap}details{padding:12px;background:#233452}</style>
<h1>20ms tickのstateと描画補間を分ける</h1><p>位置はtickごとに20増える。余りをalphaへ変換し、previous → current間を描く。描画値を書き戻す故障は次tickを汚す。</p>
<p>予想を書いて条件を実行し、正常／故障のtraceとCanvasを比べる。前提：整数ms、分数、位置。実engine・物理・audio/inputは未実施。合成deltaと壁時計rAF timestampは別記録。rAF間隔・latency・FPSは評価しない。</p>
<div id="casebuttons"></div><p id="condition"></p><label>描画位置の予想 <input id="prediction" aria-label="描画位置の予想"></label><label>次tickのcurrent予想 <input id="next" aria-label="次tickのcurrent予想"></label><label>条件JSON上書き（空欄はfixture）<textarea id="override" aria-label="条件JSON上書き（空欄はfixture）"></textarea></label>
<button id="run">実frameを描く</button><button id="hold">結果を保留して描く</button><button id="release">保留結果を受け取る</button><button id="reset">条件を初期化</button><p id="status">未実行</p><p id="ignored">古い結果の無視: 0</p>
<canvas id="canvas" width="880" height="240" aria-label="previous・current・render位置の実Canvas"></canvas><div id="trace"></div>
<details id="answer" hidden><summary>答えと実務判断</summary><p id="answerbody"></p></details>
<p>一次資料・実装・原票：<span id="links"></span></p><details><summary>実Browser raw</summary><pre id="raw"></pre></details><script type="module" src="ui.mjs"></script></html>
