<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>置換文書viewer</title><style>body{font:16px system-ui,sans-serif;background:#f2f5f4;color:#193041;margin:0}main{max-width:1120px;margin:auto;padding:24px}pre{background:white;border:1px solid #cad6d0;border-radius:10px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px ui-monospace,monospace;line-height:1.7}a{color:#18547b}li{margin:8px 0}</style><main><a href="index.html">教材UIへ戻る</a><h1 id="name">読込中</h1><p>既存sourceをそのまま表示。原典locatorは下のリンクから辿れます。</p><pre id="body"></pre><h2>文書内リンク</h2><ul id="links"></ul></main><script>
const allowed=new Set(['../../../subjects/programming-language-foundations/README.md','../../frontend-application-architecture/selection-draft-cancel/README.md','README.md','SOURCES.md','EXPECTATIONS.md','producer.py','runner.py','oracle.py','oracle.json','fixture.json','evidence/current.json','evidence/binding.json','evidence/ui-qa.json','evidence/verification.json']);const file=new URLSearchParams(location.search).get('file');document.getElementById('name').textContent=file||'未指定';if(!allowed.has(file)&&!/^evidence\/run-[0-9TZ]+-[0-9a-f]{8}\.json$/.test(file)){document.getElementById('body').textContent='未対応文書。教材UIから選んでください。';}else{fetch(file.startsWith('../')?'/reference?file='+encodeURIComponent(file):file).then(r=>{if(!r.ok)throw Error('document unavailable');return r.text();}).then(text=>{document.getElementById('body').textContent=text;if(file==='evidence/current.json'){const raw=JSON.parse(text).raw;if(/^run-[0-9TZ]+-[0-9a-f]{8}\.json$/.test(raw)){const li=document.createElement('li'),a=document.createElement('a');a.textContent='実行raw';a.href='document.html?file='+encodeURIComponent('evidence/'+raw);li.append(a);document.getElementById('links').append(li);}}for(const m of text.matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)){let a=document.createElement('a'),li=document.createElement('li'),target=m[2].split('#')[0];a.textContent=m[1];if(target.startsWith('https://'))a.href=target;else if(allowed.has(target))a.href='document.html?file='+encodeURIComponent(target);else if(target==='index.html')a.href='index.html';else continue;li.append(a);document.getElementById('links').append(li);}}).catch(e=>{document.getElementById('body').textContent='読込失敗: '+e.message;});}
</script></html>
