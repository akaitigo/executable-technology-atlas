<!doctype html><html lang="ja"><meta charset="utf-8"><title>補間実装を読む</title><style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><p><a href="index.html">教材へ戻る</a></p><h1 id="name"></h1><pre id="source"></pre><script>let n=new URLSearchParams(location.search).get('file');if(['raster.py','verify.py'].includes(n)){document.getElementById('name').textContent=n;fetch(n).then(r=>r.text()).then(t=>document.getElementById('source').textContent=t)}else document.getElementById('source').textContent='未対応';</script></html>
