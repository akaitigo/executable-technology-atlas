<!doctype html><html lang="ja"><meta charset="utf-8"><title>source reader</title><style>pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px monospace}</style><a href="index.html">教材へ戻る</a><pre id="text"></pre><script>const file=new URLSearchParams(location.search).get('file');const allowed=['original','runner.py','oracle.py','hand-oracle.json','README.md'];(async()=>{try{if(!allowed.includes(file))throw Error('unsupported source');let r=await fetch(file==='original'?'/subjects/service-networking-traffic-management/README.md':file);if(!r.ok)throw Error('HTTP '+r.status);document.getElementById('text').textContent=await r.text()}catch(e){document.getElementById('text').textContent='読込失敗: '+e}})()</script></html>
