<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sourceを読む</title><style>body{max-width:1100px;margin:auto;padding:25px;font:16px/1.8 system-ui;background:#f3f2e9}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 monospace}a{color:#116458}</style><a href="index.html">教材へ戻る</a><h1 id="title">source</h1><p id="status">読み込み中</p><pre id="content"></pre><script>const file=new URLSearchParams(location.search).get('file');const allow=['original-LEARNING_PATH.md','hand-oracle.json','model.py','oracle.py','observations/attempt-01.json','README.md','COVERAGE.md'];if(!allow.includes(file)){document.getElementById('status').textContent='REFUSED_SOURCE';}else{document.getElementById('title').textContent=file;fetch(file).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(s=>{document.getElementById('status').textContent='READ_COMPLETE';document.getElementById('content').textContent=s}).catch(e=>{document.getElementById('status').textContent='READ_FAILURE';document.getElementById('content').textContent='';});}</script></html>
