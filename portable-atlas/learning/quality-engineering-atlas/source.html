<!doctype html><html lang="ja"><meta charset="utf-8"><title>QE source reader</title><style>pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="index.html">Atlasへ戻る</a><pre id="text"></pre><script>const file=new URLSearchParams(location.search).get('file');const allowed=['model.py','oracle.py','hand-oracle.json','actual_http.py','observations/http-attempt-02/raw.json','README.md','COVERAGE.md','../subjects/requirements-engineering/README.md','../subjects/software-quality-engineering/README.md','../subjects/mathematical-statistical-foundations/README.md','../subjects/sre-incident-operations/README.md'];(async()=>{try{if(!allowed.includes(file))throw Error('unsupported source');let r=await fetch(file.startsWith('../subjects/')?'/subjects/'+file.slice(12):file);if(!r.ok)throw Error('HTTP '+r.status);document.getElementById('text').textContent=await r.text()}catch(e){document.getElementById('text').textContent='読込失敗: '+e}})()</script></html>
