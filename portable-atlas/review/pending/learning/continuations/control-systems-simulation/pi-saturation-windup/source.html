<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>source</title><style>body{max-width:1100px;margin:auto;padding:25px;font:16px/1.8 system-ui;background:#f4f2e9}pre{font:13px/1.7 monospace;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#136751}</style><a href="index.html">教材へ戻る</a><h1 id="title">source</h1><p id="status">読み込み中</p><a id="full" hidden download>全文を保存</a><pre id="content"></pre><script>const f=new URLSearchParams(location.search).get('file');const allow=["CONTRACT.md", "hand-oracle.json", "controller.py", "decimal_oracle.py", "oracle.py", "metrics.py", "observations/attempt-01.json", "README.md", "COVERAGE.md", "sources.json", "reference/LEARNING_PATH.md"];if(!allow.includes(f)){document.getElementById('status').textContent='REFUSED_SOURCE'}else{document.getElementById('title').textContent=f;fetch(f).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(s=>{document.getElementById('status').textContent=s.length>32768?'READ_COMPLETE / EXCERPT 32768 of '+s.length+' characters':'READ_COMPLETE';document.getElementById('content').textContent=s.slice(0,32768);const a=document.getElementById('full');a.href=f;a.hidden=false}).catch(e=>{document.getElementById('status').textContent='READ_FAILURE';document.getElementById('content').textContent=''})}</script></html>
