<!doctype html><html lang="ja"><meta charset="utf-8"><title>source</title><style>body{background:#0b1220;color:#edf1fa;font:16px system-ui;margin:30px}a{color:#9ac8ff}pre{white-space:pre-wrap;word-break:break-all}</style><a href="/">教材に戻る</a><h1 id="name"></h1><pre id="source"></pre><script>const file=new URLSearchParams(location.search).get('file');document.getElementById('name').textContent=file;fetch('/source?file='+encodeURIComponent(file)).then(async r=>{const v=await r.json();if(!r.ok)throw Error(v.error);document.getElementById('source').textContent=v.text;}).catch(e=>document.getElementById('source').textContent='失敗: '+e.message);</script></html>
