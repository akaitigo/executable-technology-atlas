<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Atlas：計算回数と公開値を分ける概念模型</title><desc id="desc">PUBLICATION の原典を読む模型。計算候補、保持する一つの値、同じ参照を受け取る読取りを別にする。今回の実測ではない。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247b9c"/></marker></defs><rect width="640" height="320" rx="12" fill="#eff7fa"/><g font-family="sans-serif" fill="#17354a"><text x="24" y="35" font-size="20">Atlas / PUBLICATION の規則を考える模型</text><rect x="24" y="68" width="270" height="92" rx="10" fill="white" stroke="#8eb8c9"/><text x="42" y="103" font-size="20">初期化関数の計算候補</text><text x="42" y="135" font-size="18">呼出し回数を別に数える</text><path d="M302 112H355" stroke="#247b9c" stroke-width="3" marker-end="url(#a)"/><rect x="370" y="68" width="246" height="92" rx="10" fill="#d9eff4" stroke="#8eb8c9"/><text x="387" y="103" font-size="20">保持する一つの値</text><text x="387" y="135" font-size="18">Token の参照</text><path d="M493 170V207" stroke="#247b9c" stroke-width="3" marker-end="url(#a)"/><rect x="220" y="220" width="396" height="54" rx="10" fill="white" stroke="#8eb8c9"/><text x="236" y="254" font-size="20">各読取りに返る参照を === で比べる</text><text x="24" y="302" font-size="17">公式規則の模型。今回の実行を描いた図ではありません。</text></g></svg>
