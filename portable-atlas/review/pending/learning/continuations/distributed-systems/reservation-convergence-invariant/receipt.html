<!doctype html><html lang="ja"><meta charset="utf-8"><title>実route receipt</title><style>body{background:#132638;color:#e8f2fa;font:15px system-ui;padding:25px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>実route receipt</h1><p>serverがrequest IDに保存した実行応答です。</p><pre id="receipt">読込中</pre><script>const id=new URL(location.href).searchParams.get('request');fetch('/api/receipt?request='+encodeURIComponent(id)).then(r=>r.text()).then(t=>document.querySelector('#receipt').textContent=t);</script></html>
