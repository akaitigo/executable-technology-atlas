<!doctype html><html lang="ja"><meta charset="utf-8"><title>教材のsource</title><style>body{font:16px system-ui;color:#1b3448;padding:24px}a{display:inline-block}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3f8;padding:16px}</style><a href="/">教材へ戻る</a><h1 id="name">source</h1><p id="state"></p><pre id="text"></pre><script>
const file=new URLSearchParams(location.search).get('file');fetch('/source?file='+encodeURIComponent(file)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#name').textContent=d.file;document.querySelector('#state').textContent='実ファイル全文 '+d.text.length+'文字';document.querySelector('#text').textContent=d.text;}).catch(e=>document.querySelector('#state').textContent='読出し失敗: '+e.message);
</script></html>
