<!doctype html><html lang="ja"><meta charset="utf-8"><title>原票viewer</title><style>body{max-width:1100px;margin:auto;padding:24px;font:16px/1.7 system-ui}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="index.html">教材に戻る</a><h1 id="name"></h1><pre id="body"></pre><script>const n=new URLSearchParams(location.search).get('file');document.getElementById('name').textContent=n;fetch('/document?file='+encodeURIComponent(n)).then(async r=>{document.getElementById('body').textContent=r.ok?await r.text():'取得失敗 HTTP '+r.status});</script></html>
