<!doctype html><html lang="ja"><meta charset="utf-8"><title>名前と説明の参照実験</title><style>body{max-width:1000px;margin:auto;padding:28px;font:17px/1.7 system-ui;background:#142330;color:#eef3f7}section,details{padding:20px;background:#263c50;border-radius:12px;margin:18px 0}label{display:block;margin:12px 0}input,select,button{font:17px system-ui;padding:10px}a{color:#9bddff}pre{white-space:pre-wrap;overflow-wrap:anywhere}#specimen{background:#fff;color:#172735;padding:24px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#raw{font-size:12px;max-height:320px;overflow:auto}</style><h1>見える文字・名前・説明を分ける</h1><p>操作成功だけでは、何をするボタンか伝わるとは限りません。単純な12条件を、原典の期待とMac IABの保存済み観測で比較します。</p><p>名前: native AX＋完全一致role query。説明: 全条件未観測。実AT音声・全WCAG適合・Browser版は未確認。</p><section><h2>予想してから条件を操作</h2><label>条件 <select id="case" aria-label="条件"></select></label><label>名前の予想 <input id="prediction-name" aria-label="名前の予想"></label><label>説明の予想 <input id="prediction-description" aria-label="説明の予想"></label><pre id="markup"></pre><div id="specimen"></div><p id="clicks">操作回数: 0</p><button id="compare">保存観測と比較</button><button id="hold">結果を保留</button><button id="release">保留結果を受け取る</button><button id="reset">条件を初期化</button><button id="failure">通信503で比較</button><p id="status">未実行</p><p id="ignored">古い結果の無視: 0</p></section><details id="answer" hidden><summary>答えと実務判断</summary><div id="answerbody"></div></details><section><h2>原典・実装・原票</h2><nav><a href="https://www.w3.org/TR/2026/WD-accname-1.2-20261002/#description-computation">W3C §4.2</a><a href="https://www.w3.org/TR/2026/WD-accname-1.2-20261002/#computation-steps">W3C §4.3.2</a></nav><nav id="links"></nav></section><details><summary>比較raw</summary><pre id="raw"></pre></details><script src="ui.js"></script></html>
