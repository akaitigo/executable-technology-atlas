schema_version: 1
atlas_id: executable-technology-atlas
epoch: "2026-08-28"
promise: 97 Subject Atlasの固定Releaseについて、完成済みだけでなく未完成、除外、実行困難、失効、隔離を含む状態を、署名・Digest・Evidenceへ戻って探索、比較、検証できるRead Modelを提供する。
audiences: [learner, practitioner, architect, operator, maintainer, reviewer, educator, agent]
outcomes:
  - { id: understand, title: 完成境界を理解する, target_sets: [portal-read-model] }
  - { id: choose, title: Subjectを選択する, target_sets: [portal-read-model] }
  - { id: build, title: 固定Indexを構築する, target_sets: [portal-read-model] }
  - { id: verify, title: Releaseと証拠を検証する, target_sets: [portal-read-model] }
  - { id: operate, title: Portalを運用する, target_sets: [portal-read-model] }
  - { id: troubleshoot, title: 取込失敗を診断する, target_sets: [portal-read-model] }
  - { id: evolve, title: Coverage Epochを更新する, target_sets: [portal-read-model] }
  - { id: delegate, title: Routerへ安全に委任する, target_sets: [portal-read-model] }
surfaces:
  - { id: orientation-scope, title: 定義と境界, applicability: required, rationale: PortalのRead Model境界とSource非依存性を明示する必要がある。, target_sets: [portal-read-model], required_deliverables: [concept, evidence] }
  - { id: foundations-mechanics, title: 原理, applicability: required, rationale: 署名、Digest、Schema検証の順序を再現可能にする必要がある。, target_sets: [portal-read-model], required_deliverables: [concept, test, evidence] }
  - { id: architecture-design, title: 設計, applicability: required, rationale: 固定Releaseから生成Indexへの依存方向を固定する必要がある。, target_sets: [portal-read-model], required_deliverables: [decision, evidence] }
  - { id: implementation-construction, title: 実装, applicability: required, rationale: Importer、CLI、日本語Portalを実行可能に提供する必要がある。, target_sets: [portal-read-model], required_deliverables: [reference-implementation, test, evidence] }
  - { id: testing-verification, title: 検証, applicability: required, rationale: 97件と改変拒否を決定論的に試験する必要がある。, target_sets: [portal-read-model], required_deliverables: [test, evidence] }
  - { id: failure-recovery, title: 失敗回復, applicability: required, rationale: 不正Releaseを隔離しlast-known-goodへ戻す必要がある。, target_sets: [portal-read-model], required_deliverables: [failure-catalog, runbook, evidence] }
  - { id: operations-observability, title: 運用, applicability: required, rationale: Import Reportと検証Ledgerで運用状態を追跡する必要がある。, target_sets: [portal-read-model], required_deliverables: [runbook, evidence] }
  - { id: security-privacy-safety, title: 安全性, applicability: required, rationale: 秘密、個人情報、外部script、未検証入力を拒否する必要がある。, target_sets: [portal-read-model], required_deliverables: [security-review, evidence] }
  - { id: performance-capacity-cost, title: 性能, applicability: required, rationale: 97件の探索を固定予算内で実行する必要がある。, target_sets: [portal-read-model], required_deliverables: [benchmark, evidence] }
  - { id: compatibility-integration, title: 統合, applicability: required, rationale: Core v1 SchemaとSubject release envelopeを横断検証する必要がある。, target_sets: [portal-read-model], required_deliverables: [test, evidence] }
  - { id: migration-evolution-deprecation, title: 移行, applicability: required, rationale: 新Epoch、更新済み、保守終了、失効を履歴として扱う必要がある。, target_sets: [portal-read-model], required_deliverables: [migration-guide, evidence] }
  - { id: decision-comparison, title: 比較, applicability: required, rationale: ScopeとExclusionから近接Subjectを区別する必要がある。, target_sets: [portal-read-model], required_deliverables: [decision, skill-eval] }
  - { id: provenance-rights, title: 来歴, applicability: required, rationale: Catalog、Schema、依存関係、Assetの出典と権利を固定する必要がある。, target_sets: [portal-read-model], required_deliverables: [provenance-record, evidence] }
  - { id: agent-skill, title: Agent Skill, applicability: required, rationale: Agentを知識複製ではなくCanonical IndexへRouteする必要がある。, target_sets: [portal-read-model], required_deliverables: [skill-reference, skill-eval, evidence] }
